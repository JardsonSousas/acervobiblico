<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Acervo Bíblico</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>Acervo Bíblico <small id="total"></small></h1>
  <div class="acts"><span id="who" class="m"></span><button id="in" class="pri" hidden>Entrar</button><button id="add" class="pri">Novo item</button><button id="addi" hidden>Adicionar por ISBN</button><button id="bk">Backup</button><button id="out">Sair</button></div>
  <nav id="tabs" aria-label="Seções">
    <button data-v="livros">Acervo</button><button data-v="prateleiras">Prateleiras</button><button data-v="explorar">Explorar</button><button data-v="desejos">Lista de desejo</button>
    <span class="tsep" aria-hidden="true"></span>
    <button data-v="autores">Autores</button><button data-v="editoras">Editoras</button><button data-v="colecoes">Coleções</button>
    <span class="tsep" aria-hidden="true"></span>
    <button data-v="stats">Estatísticas</button><button data-v="metas">Metas de leitura</button>
    <span class="tsep" aria-hidden="true"></span>
    <button data-v="gerenciar">Gerenciar</button>
  </nav>
</header>

<section id="tools" class="tools">
  <div class="tl">
    <div class="srch"><input id="q" type="search" placeholder="Buscar por título, autor, ISBN ou etiqueta" aria-label="Buscar"><button id="qx" type="button" class="icb" aria-label="Limpar busca" hidden>×</button></div>
    <label class="fl">Tipo<select id="ftp"><option value="">Livros e revistas</option><option value="livro">Só livros</option><option value="revista">Só revistas</option></select></label>
    <label class="fl">Ordenar por<select id="so"><option value="cad">Cadastro: mais recentes primeiro</option><option value="cad_a">Cadastro: mais antigos primeiro</option><option value="title">Título A–Z</option><option value="title_d">Título Z–A</option><option value="author">Autor A–Z</option><option value="publisher">Editora A–Z</option><option value="year">Publicação: mais novos</option><option value="year_a">Publicação: mais antigos</option><option value="pdate">Compra: mais recentes</option><option value="pdate_a">Compra: mais antigas</option><option value="added">Data “adicionado em”: mais recentes</option><option value="added_a">Data “adicionado em”: mais antigos</option><option value="rating">Melhor avaliados</option></select></label>
    <div class="seg" id="vseg" role="group" aria-label="Modo de exibição"><button type="button" data-vm="grade">Grade</button><button type="button" data-vm="lista">Lista</button><button type="button" data-vm="tabela">Tabela</button></div>
  </div>
  <div class="tl tl2">
    <button id="advb" type="button" aria-expanded="false" aria-controls="facets">Filtros</button>
    <button id="sidb" hidden>Categorias e etiquetas</button><button id="selb" hidden>Selecionar</button><button id="cfg" hidden>Ajustes da lista</button><button id="rnd">Escolher o próximo livro</button>
    <span class="sp"></span><span id="cnt" class="m" role="status" aria-live="polite"></span>
  </div>
  <span id="selact" class="tl selbar" hidden><span id="selc" class="m"></span><button id="sela">Selecionar todos</button><button id="selm" class="pri">Editar em massa</button><button id="selcat">Copiar para o catálogo</button><button id="selw">Adicionar à lista de desejo</button><button id="selo">Adicionar ao acervo</button><button id="selcmp">Comparar</button><button id="sele">Vincular como edições</button><button id="seld" class="dg">Excluir</button></span>
  <div id="chips" class="chips" hidden aria-label="Filtros ativos"></div>
  <div id="stbar" class="stbar" role="group" aria-label="Status de leitura" hidden></div>
  <div id="exp" class="exp expbox" hidden>
    <strong>Buscar livros novos na internet</strong>
    <select id="prov" aria-label="Fonte da busca online"><option value="google">Google Livros</option><option value="ol">Open Library</option></select>
    <label class="ck2"><input type="checkbox" id="pt" checked> Só português</label>
    <button id="srch" class="pri">Buscar na internet</button>
    <button id="addcat">Novo no catálogo</button>
    <span id="hitbar"></span>
  </div>
  <details id="adv" class="advd"><summary>Filtros avançados</summary><div id="facets" class="facets"></div></details>
</section>

<div class="wrap"><aside id="side" hidden aria-label="Categorias e etiquetas"></aside><main id="main"></main></div>
<dialog id="dlg"></dialog>
<input type="file" id="fileImp" accept=".json,.csv,.xlsx,.xls" hidden>
<div id="toast" role="status"></div>
<div id="auth" hidden>
  <form id="af"><h2>Acervo Bíblico</h2><p id="am" class="m"></p>
    <label>E-mail<input type="email" name="email" autocomplete="username" required></label>
    <label>Senha<input type="password" name="pw" autocomplete="current-password" required></label>
    <button class="pri" id="asub">Entrar</button><button type="button" id="atog" class="lk">Criar conta</button><button type="button" id="acx" class="lk">Voltar ao Explorar</button><p id="ae" role="alert"></p></form>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
